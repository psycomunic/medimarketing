<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B4F6C" />
    <title>Sem conexão · Medi Marketing</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fbfc;
        color: #2e3a40;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .cartao { max-width: 360px; }
      .icone { width: 72px; height: 72px; border-radius: 50%; }
      h1 { margin: 20px 0 8px; font-size: 22px; color: #0b4f6c; }
      p { margin: 0; line-height: 1.55; color: #6b7a82; }
      button {
        margin-top: 24px;
        height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 12px;
        background: #0b4f6c;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="cartao">
      <img class="icone" src="/icones-app/icone-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>A agenda e os pacientes precisam de internet para aparecer atualizados. Assim que a conexão voltar, é só tentar de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
    <script>
      // Voltou a internet: recarrega sozinho
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
